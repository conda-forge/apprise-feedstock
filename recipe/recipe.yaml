schema_version: 1

context:
  name: apprise
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apprise-${{ version }}.tar.gz
  sha256: aeb321737f951860d7cb0a9574159090cbdbcb0f1ba01c6b49c69018380adf8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - apprise = apprise.cli:main

requirements:
  host:
    - babel
    - pip
    - python ${{ python_min }}.*
    - setuptools >=69
    - wheel
  run:
    - python >=${{ python_min }}
    - requests
    - urllib3
    - requests-oauthlib
    - click >=5.0
    - markdown
    - pyyaml
    - certifi
    - python-tzdata

tests:
  - python:
      imports:
        - apprise
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - apprise --help
    
about:
  summary: Push Notifications that work with just about every platform
  license: MIT
  license_file:
    - LICENSE
  homepage: https://hub.docker.com/r/caronc/apprise
  repository: https://github.com/caronc/apprise
  documentation: https://github.com/caronc/apprise/wiki

extra:
  recipe-maintainers:
    - thewchan
